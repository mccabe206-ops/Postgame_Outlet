name: Update PGO season

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    # Extra checks only do full work during an inactive watch window; GitHub can delay runs.
    - cron: "2,12,17,27,32,42,47,57 * * * *"
  workflow_dispatch:
    inputs:
      alert_delivery_check:
        description: Send a clearly labeled owner notification setup check
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  refresh:
    concurrency:
      group: board-update
      cancel-in-progress: false
    outputs:
      saved_sha: ${{ steps.saved.outputs.sha || steps.publish.outputs.sha || steps.source.outputs.sha }}
      run_refresh: ${{ steps.route.outputs.run_refresh }}
      verify_outcome: ${{ steps.verify.outcome }}
      refresh_outcome: ${{ steps.refresh.outcome }}
      render_outcome: ${{ steps.render.outcome }}
      publish_outcome: ${{ steps.publish.outcome }}
      refresh_started_at: ${{ steps.refresh.outputs.started_at }}
    if: github.repository == 'walshja9/Postgame_Outlet'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Record checked-out source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pgo.txt
      - name: Route extra inactive checks
        id: route
        env:
          PYTHONPATH: ${{ github.workspace }}
          PGO_EVENT: ${{ github.event_name }}
          PGO_SCHEDULE: ${{ github.event.schedule }}
        shell: python
        run: |
          import os
          from pgo_season import availability_watch, load_current, now, utc

          extra = (os.environ['PGO_EVENT'] == 'schedule'
                   and os.environ['PGO_SCHEDULE'] == '2,12,17,27,32,42,47,57 * * * *')
          run_refresh = True
          if extra:
              checked_at = now()
              watch = availability_watch(load_current(), checked_at)
              run_refresh = any(utc(game['kickoff']) > utc(checked_at) or game['status'] != 'VERIFIED'
                                for game in watch['games'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_refresh={str(run_refresh).lower()}\n')
          print('Full season refresh' if run_refresh else 'No inactive watch window; extra tick skipped')
      - name: Verify automatic grading, model updates, availability and rendering
        id: verify
        if: steps.route.outputs.run_refresh == 'true'
        run: python -m unittest tests.test_pgo_current_starters tests.test_pgo_current_projection tests.test_pgo_current_projection_view tests.test_pgo_current_rankings_view tests.test_mccabe_forecasts tests.test_pgo_legacy_grades tests.test_pgo_season tests.test_pgo_season_boundaries tests.test_pgo_expected_starters tests.test_pgo_starter_revision tests.test_pgo_availability_scope tests.test_pgo_starter_capture tests.test_pgo_starter_pending tests.test_pgo_player_identity tests.test_pgo_offensive_identity_refresh tests.test_pgo_offensive_inventory tests.test_pgo_offensive_usage_monitor tests.test_pgo_score_range_monitor tests.test_pgo_season_sources tests.test_pgo_season_model tests.test_pgo_season_statistics tests.test_pgo_statistics_review tests.test_pgo_season_availability tests.test_pgo_inactive_club tests.test_pgo_inactive_nfl tests.test_pgo_inactive_v5 tests.test_pgo_inactive_v7 tests.test_pgo_inactive_v8 tests.test_pgo_inactive_v9 tests.test_pgo_inactive_names_v7 tests.test_pgo_render_state tests.test_pgo_render_pages tests.test_pgo_season_view tests.test_pgo_season_storage tests.test_pgo_season_rollover tests.test_pgo_season_accuracy tests.test_pgo_weekly_review tests.test_pgo_market_benchmark tests.test_pgo_alerts tests.test_pgo_penalty_candidate tests.test_pgo_penalty_monitor tests.test_pgo_penalty_integration tests.test_pgo_totals_monitor tests.test_pgo_weights_monitor tests.test_pgo_replacement_depth tests.test_pgo_replacement_refresh tests.test_pgo_defender_inventory tests.test_pgo_injury_usage_monitor tests.test_pgo_season_experiments tests.test_pgo_experiment_view tests.test_pgo_ats tests.test_pgo_ats_view tests.test_pgo_inactive_monitor tests.test_pgo_publication_guard tests.test_pgo_workflow_status tests.test_public_board_workflow
      - name: Capture verified finals and advance eligible forecasts
        id: refresh
        if: steps.route.outputs.run_refresh == 'true'
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('started_at=' + datetime.now(timezone.utc).isoformat() + '\n')
          PY
          python pgo_season.py --refresh
      - name: Render current board and auditable archives
        id: render
        if: steps.route.outputs.run_refresh == 'true'
        run: |
          python pgo_weekly_review.py
          python pgo_render_pages.py
      - name: Publish changed season data and pages
        id: publish
        if: steps.route.outputs.run_refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/season-2026 docs/index.html docs/forecast-lab.html
          if [ -d docs/analysis/weekly ]; then git add docs/analysis/weekly; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update verified PGO season records and forecasts"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            gh api --method POST repos/${{ github.repository }}/pages/builds
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Record saved publication commit
        id: saved
        if: always()
        env:
          PGO_PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          PGO_CHECKED_OUT_SHA: ${{ steps.source.outputs.sha }}
        shell: python
        run: |
          import os
          saved = os.environ['PGO_PUBLISHED_SHA'] or os.environ['PGO_CHECKED_OUT_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('sha=' + saved + '\n')

  audit:
    needs: refresh
    outputs:
      rollover_outcome: ${{ steps.rollover.outcome }}
    if: always() && github.repository == 'walshja9/Postgame_Outlet' && needs.refresh.outputs.run_refresh != 'false' && (needs.refresh.result != 'cancelled' || needs.refresh.outputs.saved_sha != '' || needs.refresh.outputs.run_refresh != '')
    concurrency:
      group: pgo-rollover-audit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.refresh.outputs.saved_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pgo.txt
      - name: Report saved season, inactive context and independent experiment health
        if: always() && needs.refresh.outputs.refresh_outcome == 'success'
        run: python pgo_workflow_status.py
      - name: Observe the latest weekly rollover
        id: rollover
        if: always() && needs.refresh.outputs.refresh_outcome == 'success'
        run: python pgo_season_rollover.py --output output/rollover-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Retain rollover evidence
        if: always() && needs.refresh.outputs.refresh_outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rollover-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/rollover-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90

  notify:
    needs: [refresh, audit]
    if: always() && github.repository == 'walshja9/Postgame_Outlet' && needs.refresh.outputs.run_refresh != 'false' && (needs.refresh.result != 'cancelled' || needs.refresh.outputs.saved_sha != '' || needs.refresh.outputs.run_refresh != '')
    concurrency:
      group: board-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pgo.txt
      - name: Check whether the audited state is still current
        id: current
        if: always()
        env:
          PGO_SAVED_SHA: ${{ needs.refresh.outputs.saved_sha || github.sha }}
          PGO_WORKSPACE: ${{ github.workspace }}
          PGO_AUDIT_RESULT: ${{ needs.audit.result }}
          PGO_ROLLOVER_OUTCOME: ${{ needs.audit.outputs.rollover_outcome }}
        shell: python
        run: |
          import os
          import subprocess
          result = subprocess.run(['git', 'diff', '--quiet', os.environ['PGO_SAVED_SHA'], 'HEAD',
              '--', 'docs/evidence/season-2026/current.json'], cwd=os.environ['PGO_WORKSPACE'])
          if result.returncode not in (0, 1):
              raise RuntimeError('Could not compare audited and current season pointers')
          same = result.returncode == 0
          audit = os.environ['PGO_AUDIT_RESULT']
          rollover = (audit if audit in ('failure', 'cancelled') else
                      os.environ['PGO_ROLLOVER_OUTCOME'] or audit)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('same_state=' + str(same).lower() + '\n')
              output.write('rollover_outcome=' + rollover + '\n')
          print('Audited state is current; assess owner alerts' if same else
                'Audited state was superseded; receipt and CI outcome retained, stale owner alerts skipped')
      - name: Check notification delivery when requested
        if: steps.current.outputs.same_state == 'true' && github.event_name == 'workflow_dispatch' && inputs.alert_delivery_check && needs.refresh.outputs.publish_outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          PGO_VERIFY: ${{ needs.refresh.outputs.verify_outcome }}
          PGO_REFRESH: ${{ needs.refresh.outputs.refresh_outcome }}
          PGO_RENDER: ${{ needs.refresh.outputs.render_outcome }}
          PGO_PUBLISH: ${{ needs.refresh.outputs.publish_outcome }}
          PGO_ROLLOVER: ${{ steps.current.outputs.rollover_outcome }}
          PGO_REFRESH_STARTED: ${{ needs.refresh.outputs.refresh_started_at }}
        shell: python
        run: |
          import json
          import os
          import pgo_alerts as alerts
          report = alerts.assess(alerts.load_current(alerts.DEFAULT_ROOT),
              outcomes={stage: os.environ['PGO_' + stage.upper()] for stage in alerts.STAGES},
              refresh_started_at=os.environ['PGO_REFRESH_STARTED'],
              public_pointer=alerts.fetch_public_pointer())
          if report['can_resolve'] and alerts._owned_issue(alerts.github_api)[0] is None:
              report['conditions'] = [dict(key='commissioning', urgent=False,
                  message='Notification delivery setup check only. No model or data failure is being reported.')]
              report['can_resolve'] = False
              url = ('https://github.com/' + alerts.REPOSITORY + '/actions/runs/'
                     + os.environ['GITHUB_RUN_ID'] + '/attempts/' + os.environ['GITHUB_RUN_ATTEMPT'])
              print(json.dumps(alerts.deliver(report, alerts.github_api, url), sort_keys=True))
          else:
              print('Delivery setup check skipped: current health or an existing incident needs review.')
      - name: Notify the PGO owner when attention is needed
        if: always() && steps.current.outputs.same_state == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pgo_alerts.py --deliver --check-public \
            --run-refresh '${{ needs.refresh.outputs.run_refresh }}' \
            --verify-outcome '${{ needs.refresh.outputs.verify_outcome }}' \
            --refresh-outcome '${{ needs.refresh.outputs.refresh_outcome }}' \
            --render-outcome '${{ needs.refresh.outputs.render_outcome }}' \
            --publish-outcome '${{ needs.refresh.outputs.publish_outcome }}' \
            --rollover-outcome '${{ steps.current.outputs.rollover_outcome }}' \
            --refresh-started-at '${{ needs.refresh.outputs.refresh_started_at }}'
